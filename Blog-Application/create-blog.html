<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Blog - MyBlog</title><link rel="stylesheet" href="css/style.css"></head><body><header><a class="logo" href="index.html">My<span>Blog</span></a><nav><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><button id="logout" class="link-btn">Logout</button></nav></header><main class="form-wrap wide"><form id="blog-form" class="panel"><p class="tag">SHARE YOUR IDEA</p><h1 id="form-title">Create a Blog</h1><label>Blog Title</label><input id="blog-title" required placeholder="Enter blog title"><label>Category</label><select id="blog-category"><option>Technology</option><option>Education</option><option>Travel</option><option>Lifestyle</option><option>Personal</option></select><label>Image URL (optional)</label><input id="blog-image" type="url" placeholder="https://example.com/image.jpg"><label>Blog Content</label><textarea id="blog-content" rows="10" required minlength="10" placeholder="Write your blog here..."></textarea><button class="btn" type="submit">Publish Blog</button><p id="blog-message" class="notice"></p></form></main><script src="js/app.js"></script></body></html>
